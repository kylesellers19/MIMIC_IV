# PySpark pipeline — a Spark standalone cluster (no Databricks): one master and N workers, each its own JVM.
# Runs on this Mac (scripts/spark_standalone.sh starts one on 127.0.0.1) or on machines you control. Lists only what
# differs from conf/spark_local.yaml; spark.conf is taken whole from here.
#
# On several machines: the same repository checkout, .venv-spark and JDK at the same path on every node, and
# raw_root / out_root / runs_root on a file system mounted at the same path everywhere (NFS or a cloud file share).
# Steps run through scripts/spark_job.py, which ships the code to the executors.

extends: conf/spark_local.yaml
extends_replace: [spark.conf]
run_name_prefix: standalone

spark:
  master: spark://127.0.0.1:7077
  conf:
    spark.driver.memory: 4g
    spark.executor.memory: 6g          # per executor; workers are started with enough memory for one each
    spark.executor.cores: 4
    spark.cores.max: 8
    spark.sql.session.timeZone: UTC
    spark.sql.shuffle.partitions: 64
    spark.sql.adaptive.enabled: true
    spark.sql.parquet.compression.codec: zstd
    spark.ui.enabled: false
    spark.ui.showConsoleProgress: false
    spark.eventLog.enabled: false
    spark.driver.bindAddress: 127.0.0.1
    spark.driver.host: 127.0.0.1
